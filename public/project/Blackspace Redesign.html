<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Blackspace — Homepage Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #111; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="directions/editorial.jsx"></script>
<script type="text/babel" src="directions/brutalist.jsx"></script>
<script type="text/babel" src="directions/swiss.jsx"></script>
<script type="text/babel" src="directions/cinematic.jsx"></script>
<script type="text/babel" src="directions/fusion.jsx"></script>
<script type="text/babel" src="directions/sticker-pop.jsx"></script>
<script type="text/babel" src="directions/cobalt-poster.jsx"></script>
<script type="text/babel" src="directions/asterisk-studio.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas title="Blackspace — Homepage Redesign" subtitle="Directions exploring aesthetic, voice, and layout. Click any artboard to focus.">
        <DCSection id="newrefs" title="★ Built from your refs — Pastel × Pop × Sticker">
          <DCArtboard id="sticker-pop" label="A — Sticker Pop (Officely × ES+ cheeky labels)" width={1440} height={2400}>
            <window.StickerPopDirection />
          </DCArtboard>
          <DCArtboard id="cobalt-poster" label="B — Cobalt Poster (ES+ portfolio energy)" width={1440} height={2400}>
            <window.CobaltPosterDirection />
          </DCArtboard>
          <DCArtboard id="asterisk-studio" label="C — Asterisk Studio (Make it Simple × Max Pratt × Titans)" width={1440} height={2400}>
            <window.AsteriskStudioDirection />
          </DCArtboard>
        </DCSection>
        <DCSection id="fusion" title="★ Earlier — Pastel Pop Fusion">
          <DCArtboard id="fusion" label="05 — Pastel × Pop × Editorial (Content / AI studio)" width={1440} height={2400}>
            <window.FusionDirection />
          </DCArtboard>
        </DCSection>
        <DCSection id="directions" title="Earlier directions">
          <DCArtboard id="editorial" label="01 — Editorial / Magazine" width={1440} height={2400}>
            <window.EditorialDirection />
          </DCArtboard>
          <DCArtboard id="brutalist" label="02 — Brutalist / Mono-grid" width={1440} height={2400}>
            <window.BrutalistDirection />
          </DCArtboard>
          <DCArtboard id="swiss" label="03 — Swiss / Helvetica minimal" width={1440} height={2400}>
            <window.SwissDirection />
          </DCArtboard>
          <DCArtboard id="cinematic" label="04 — Dark / Cinematic" width={1440} height={2400}>
            <window.CinematicDirection />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
